    <title>Fairlend Hero Responsive Audit - handwritten-caret-reduced</title>
    <style>
      body {
        margin: 0;
        background: #fffdf7;
        color: #08252c;
        font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
        gap: 24px;
        padding: 24px;
      }
      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid color-mix(in oklab, #08252c 12%, transparent);
        border-radius: 14px;
        background: white;
        box-shadow: 0 14px 40px rgb(8 37 44 / 10%);
      }
      img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        object-position: top center;
      }
      figcaption {
        display: grid;
        gap: 2px;
        padding: 12px 14px 14px;
      }
      figcaption span,
      figcaption a {
        color: #47626b;
      }
    </style>
  </head>
