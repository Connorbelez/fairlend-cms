<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lossless, navigable field-manual edition of the supplied source documents.">
  <title>Source Document Field Manual</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23193753'/%3E%3Cpath d='M17 19h30v7H17zm0 12h22v7H17zm0 12h30v7H17z' fill='%23d4a73a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
  <script>
    (function () {
      var saved = localStorage.getItem("convex-field-manual-theme");
      if (saved) document.documentElement.dataset.theme = saved;
    })();
  </script>
  <style>
    :root {
      --bg: #f3efe7;
      --paper: #fffdf8;
      --paper-alt: #f8f3e9;
      --ink: #17263a;
      --ink-soft: #536174;
      --ink-faint: #7f8995;
      --navy: #193753;
      --navy-soft: #dfe8ef;
      --gold: #b0812b;
      --gold-soft: #f4ead4;
      --sage: #55745e;
      --sage-soft: #e3ece5;
      --rust: #a84c2f;
      --rust-soft: #f4e3dc;
      --border: rgba(23, 38, 58, 0.14);
      --border-strong: rgba(23, 38, 58, 0.26);
      --shadow: 0 22px 70px rgba(30, 42, 56, 0.11);
      --font-display: "Newsreader", Georgia, serif;
      --font-body: "IBM Plex Sans", ui-sans-serif, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      color-scheme: light;
    }

    :root[data-theme="dark"] {
      --bg: #101821;
      --paper: #17222d;
      --paper-alt: #1c2935;
      --ink: #edf1f2;
      --ink-soft: #b4c0c7;
      --ink-faint: #87969f;
      --navy: #8eb6d2;
      --navy-soft: #223848;
      --gold: #d4ad5e;
      --gold-soft: #3a3022;
      --sage: #91b39a;
      --sage-soft: #25382c;
      --rust: #df8c6f;
      --rust-soft: #412c27;
      --border: rgba(230, 239, 243, 0.12);
      --border-strong: rgba(230, 239, 243, 0.23);
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
      color-scheme: dark;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #101821;
        --paper: #17222d;
        --paper-alt: #1c2935;
        --ink: #edf1f2;
        --ink-soft: #b4c0c7;
        --ink-faint: #87969f;
        --navy: #8eb6d2;
        --navy-soft: #223848;
        --gold: #d4ad5e;
        --gold-soft: #3a3022;
        --sage: #91b39a;
        --sage-soft: #25382c;
        --rust: #df8c6f;
        --rust-soft: #412c27;
        --border: rgba(230, 239, 243, 0.12);
        --border-strong: rgba(230, 239, 243, 0.23);
        --shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background:
        linear-gradient(rgba(43, 59, 75, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(43, 59, 75, 0.035) 1px, transparent 1px),
        radial-gradient(circle at 12% 0%, var(--gold-soft), transparent 28rem),
        var(--bg);
      background-size: 32px 32px, 32px 32px, auto, auto;
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.68;
      overflow-wrap: break-word;
    }

    a { color: var(--navy); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:hover { color: var(--rust); }
    button, input { font: inherit; }
    button { color: inherit; }
    .reading-progress {
      position: fixed;
      z-index: 1000;
      inset: 0 auto auto 0;
      height: 3px;
      width: 0;
      background: var(--gold);
      transition: width 80ms linear;
    }

    .masthead {
      position: relative;
      border-bottom: 1px solid var(--border);
      padding: 56px max(24px, calc((100vw - 1480px) / 2)) 42px;
      overflow: hidden;
    }
    .masthead::after {
      content: "FIELD MANUAL / 2026";
      position: absolute;
      right: max(24px, calc((100vw - 1480px) / 2));
      top: 26px;
      color: var(--ink-faint);
      font: 500 10px/1 var(--font-mono);
      letter-spacing: 0.18em;
    }
    .eyebrow, .section-kicker {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--gold);
      font: 600 11px/1.3 var(--font-mono);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .eyebrow::before, .section-kicker::before {
      content: "";
      width: 28px;
      height: 1px;
      background: currentColor;
    }
    .masthead h1 {
      max-width: 960px;
      margin: 18px 0 14px;
      font: 600 clamp(42px, 6vw, 84px)/0.98 var(--font-display);
      letter-spacing: -0.035em;
    }
    .masthead .lede {
      max-width: 820px;
      margin: 0;
      color: var(--ink-soft);
      font: 400 clamp(18px, 2vw, 23px)/1.55 var(--font-display);
    }

    .metric-band {
      display: grid;
      grid-template-columns: 1.2fr repeat(4, minmax(120px, 0.7fr));
      gap: 1px;
      max-width: 1480px;
      margin: 32px auto 0;
      border: 1px solid var(--border);
      background: var(--border);
      box-shadow: var(--shadow);
    }
    .metric {
      min-width: 0;
      padding: 20px 22px;
      background: var(--paper);
    }
    .metric--primary {
      background: var(--navy);
      color: var(--paper);
    }
    :root[data-theme="dark"] .metric--primary { color: #101821; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .metric--primary { color: #101821; }
    }
    .metric__value {
      display: block;
      font: 600 26px/1 var(--font-display);
      font-variant-numeric: tabular-nums;
    }
    .metric__label {
      display: block;
      margin-top: 8px;
      color: var(--ink-faint);
      font: 500 9px/1.3 var(--font-mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .metric--primary .metric__label { color: currentColor; opacity: 0.72; }

    .toolbar {
      position: sticky;
      z-index: 300;
      top: 0;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 12px max(20px, calc((100vw - 1480px) / 2));
      background: color-mix(in srgb, var(--bg) 91%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
    }
    .segmented, .toolbar__actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .segmented button, .icon-button, .search-button {
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--paper);
      cursor: pointer;
      font: 500 11px/1 var(--font-mono);
      transition: border-color 140ms, background 140ms, transform 140ms;
    }
    .segmented button:hover, .icon-button:hover, .search-button:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }
    .segmented button[aria-pressed="true"] {
      border-color: var(--navy);
      background: var(--navy);
      color: var(--paper);
    }
    :root[data-theme="dark"] .segmented button[aria-pressed="true"] { color: #101821; }
    .search-cluster {
      display: flex;
      align-items: center;
      min-width: min(360px, 34vw);
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--paper);
      overflow: hidden;
    }
    .search-cluster input {
      min-width: 0;
      flex: 1;
      height: 36px;
      border: 0;
      outline: 0;
      padding: 0 4px 0 14px;
      background: transparent;
      color: var(--ink);
      font-size: 12px;
    }
    .search-button {
      min-height: 30px;
      margin-right: 3px;
      border: 0;
      background: var(--gold-soft);
      color: var(--gold);
    }

    .shell {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 52px;
      max-width: 1480px;
      margin: 0 auto;
      padding: 44px 24px 100px;
    }
    .toc {
      position: sticky;
      top: 74px;
      align-self: start;
      max-height: calc(100dvh - 96px);
      overflow-y: auto;
      padding: 6px 12px 24px 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }
    .toc__title {
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      color: var(--ink-faint);
      font: 600 9px/1.4 var(--font-mono);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .toc a {
      display: block;
      margin: 2px 0;
      padding: 5px 8px;
      border-left: 2px solid transparent;
      border-radius: 0 5px 5px 0;
      color: var(--ink-soft);
      font-size: 11px;
      line-height: 1.35;
      text-decoration: none;
    }
    .toc a[data-level="1"] {
      margin-top: 14px;
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .toc a[data-level="3"] { padding-left: 18px; font-size: 10px; }
    .toc a:hover { background: var(--paper-alt); color: var(--ink); }
    .toc a.active {
      border-left-color: var(--gold);
      background: var(--gold-soft);
      color: var(--ink);
    }

    main { min-width: 0; }
    .integrity-panel {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 34px;
    }
    .integrity-card {
      min-width: 0;
      padding: 16px 18px;
      border: 1px solid var(--border);
      background: var(--paper);
    }
    .integrity-card__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .integrity-card strong { font-size: 13px; }
    .integrity-status {
      flex: 0 0 auto;
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--gold-soft);
      color: var(--gold);
      font: 600 9px/1.4 var(--font-mono);
      text-transform: uppercase;
    }
    .integrity-status.verified { background: var(--sage-soft); color: var(--sage); }
    .integrity-status.failed { background: var(--rust-soft); color: var(--rust); }
    .integrity-card code {
      display: block;
      margin-top: 9px;
      overflow: hidden;
      color: var(--ink-faint);
      font: 400 9px/1.4 var(--font-mono);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .document {
      min-width: 0;
      margin-bottom: 56px;
      border: 1px solid var(--border);
      background: var(--paper);
      box-shadow: 0 18px 60px rgba(25, 40, 58, 0.07);
    }
    .document[hidden] { display: none; }
    .document__head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      padding: 34px 42px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--paper-alt);
    }
    .document__head h2 {
      margin: 7px 0 0;
      font: 600 clamp(28px, 4vw, 48px)/1.05 var(--font-display);
      letter-spacing: -0.02em;
    }
    .document__meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .doc-badge {
      padding: 5px 8px;
      border: 1px solid var(--border);
      color: var(--ink-soft);
      background: var(--paper);
      font: 500 9px/1.2 var(--font-mono);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .markdown-body {
      min-width: 0;
      padding: 44px clamp(24px, 5vw, 72px) 72px;
      font-size: 16px;
    }
    .markdown-body > * { max-width: 900px; margin-left: auto; margin-right: auto; }
    .markdown-body > .table-scroll,
    .markdown-body > .diagram-shell,
    .markdown-body > pre { max-width: 1120px; }
    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 {
      position: relative;
      color: var(--ink);
      font-family: var(--font-display);
      font-weight: 600;
      line-height: 1.13;
      letter-spacing: -0.018em;
      scroll-margin-top: 84px;
    }
    .markdown-body h1 {
      margin-top: 0;
      margin-bottom: 30px;
      font-size: clamp(36px, 5vw, 64px);
    }
    .markdown-body h2 {
      margin-top: 72px;
      padding-top: 26px;
      border-top: 1px solid var(--border);
      font-size: clamp(28px, 3vw, 42px);
    }
    .markdown-body h2::before {
      content: attr(data-index);
      position: absolute;
      left: -42px;
      top: 34px;
      color: var(--gold);
      font: 500 9px/1 var(--font-mono);
      letter-spacing: 0.1em;
    }
    .markdown-body h3 { margin-top: 45px; font-size: 25px; }
    .markdown-body h4 { margin-top: 32px; font-size: 20px; }
    .markdown-body p { margin-top: 0; margin-bottom: 18px; color: var(--ink-soft); }
    .markdown-body strong { color: var(--ink); }
    .markdown-body ul, .markdown-body ol {
      margin: 0 auto 22px;
      padding-left: 1.5em;
      color: var(--ink-soft);
    }
    .markdown-body li { margin: 7px 0; padding-left: 0.25em; }
    .markdown-body li::marker { color: var(--gold); font-weight: 600; }
    .markdown-body blockquote {
      margin-top: 32px;
      margin-bottom: 32px;
      padding: 22px 28px;
      border-left: 4px solid var(--gold);
      background: var(--gold-soft);
      color: var(--ink);
      font: 500 20px/1.55 var(--font-display);
    }
    .markdown-body blockquote p { margin: 0; color: inherit; }
    .markdown-body hr {
      margin-top: 58px;
      margin-bottom: 58px;
      border: 0;
      border-top: 1px solid var(--border);
    }
    .markdown-body :not(pre) > code {
      padding: 2px 5px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--paper-alt);
      color: var(--rust);
      font: 500 0.84em/1.4 var(--font-mono);
      overflow-wrap: anywhere;
    }
    .markdown-body pre {
      margin-top: 24px;
      margin-bottom: 28px;
      padding: 20px 22px;
      overflow: auto;
      border: 1px solid var(--border);
      border-left: 3px solid var(--navy);
      background: #12202c;
      color: #e8eef1;
      font: 400 12px/1.7 var(--font-mono);
      tab-size: 2;
    }
    .markdown-body pre code { font: inherit; white-space: pre; }

    .table-scroll {
      margin-top: 30px;
      margin-bottom: 36px;
      overflow-x: auto;
      border: 1px solid var(--border);
      background: var(--paper);
    }
    table {
      width: 100%;
      min-width: 660px;
      border-collapse: collapse;
      font-size: 13px;
      line-height: 1.5;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 12px 15px;
      border-bottom: 2px solid var(--border-strong);
      background: var(--navy);
      color: var(--paper);
      font: 600 10px/1.35 var(--font-mono);
      letter-spacing: 0.06em;
      text-align: left;
      text-transform: uppercase;
    }
    :root[data-theme="dark"] th { color: #101821; }
    td {
      min-width: 120px;
      padding: 13px 15px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      color: var(--ink-soft);
    }
    tbody tr:nth-child(even) { background: var(--paper-alt); }
    tbody tr:hover { background: var(--gold-soft); }
    td:first-child { color: var(--ink); font-weight: 500; }

    .diagram-shell {
      position: relative;
      margin-top: 32px;
      margin-bottom: 42px;
      border: 1px solid var(--border);
      background: var(--paper-alt);
    }
    .diagram-shell__hint {
      margin: 0;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--ink-faint);
      font: 500 9px/1.4 var(--font-mono);
      letter-spacing: 0.04em;
    }
    .mermaid-wrap { position: relative; min-height: 380px; overflow: hidden; }
    .zoom-controls {
      position: absolute;
      z-index: 20;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 4px;
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--paper) 92%, transparent);
      backdrop-filter: blur(10px);
    }
    .zoom-controls button {
      width: 29px;
      height: 29px;
      padding: 0;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-soft);
      cursor: pointer;
      font: 600 11px/1 var(--font-mono);
    }
    .zoom-controls button:hover { border-color: var(--border); background: var(--paper-alt); color: var(--ink); }
    .zoom-label { min-width: 42px; color: var(--ink-faint); font: 500 9px/1 var(--font-mono); text-align: center; }
    .mermaid-viewport {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: min(72vh, 760px);
      min-height: 380px;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }
    .mermaid-viewport:active { cursor: grabbing; }
    .mermaid-canvas {
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: 0 0;
      will-change: transform;
    }
    .mermaid-canvas svg { display: block; max-width: none !important; height: auto; }
    .mermaid .node rect, .mermaid .node polygon, .mermaid .node path { stroke-width: 1.4px !important; }
    .mermaid .edgeLabel { background: var(--paper) !important; color: var(--ink) !important; }
    .mermaid .label, .mermaid text { font-family: var(--font-body) !important; }

    .loading {
      padding: 100px 24px;
      color: var(--ink-faint);
      font: 500 12px/1.5 var(--font-mono);
      text-align: center;
    }
    .error-card {
      padding: 24px;
      border: 1px solid var(--rust);
      background: var(--rust-soft);
      color: var(--rust);
    }
    .back-top {
      position: fixed;
      z-index: 250;
      right: 20px;
      bottom: 20px;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--paper);
      color: var(--ink);
      box-shadow: var(--shadow);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms, transform 160ms;
    }
    .back-top.visible { opacity: 1; pointer-events: auto; }
    .back-top:hover { transform: translateY(-2px); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .masthead > *, .metric-band, .integrity-panel, .document {
      animation: rise 520ms both;
      animation-delay: calc(var(--i, 0) * 70ms);
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }

    @media (max-width: 1050px) {
      .metric-band { grid-template-columns: repeat(2, 1fr); }
      .metric--primary { grid-column: 1 / -1; }
      .shell { grid-template-columns: 1fr; gap: 22px; padding-top: 0; }
      .toc {
        position: sticky;
        z-index: 240;
        top: 61px;
        display: flex;
        gap: 3px;
        align-items: center;
        max-height: none;
        margin: 0 -24px;
        padding: 8px 24px;
        overflow-x: auto;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        scrollbar-width: none;
      }
      .toc::-webkit-scrollbar { display: none; }
      .toc__title { display: none; }
      .toc a, .toc a[data-level="1"], .toc a[data-level="3"] {
        flex: 0 0 auto;
        margin: 0;
        padding: 6px 9px;
        border-left: 0;
        border-bottom: 2px solid transparent;
        border-radius: 4px 4px 0 0;
        font-size: 9px;
        white-space: nowrap;
        text-transform: none;
      }
      .toc a.active { border-left: 0; border-bottom-color: var(--gold); }
      .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { scroll-margin-top: 118px; }
    }

    @media (max-width: 760px) {
      .masthead { padding: 50px 18px 30px; }
      .masthead::after { right: 18px; top: 18px; font-size: 8px; }
      .metric-band { margin-top: 24px; grid-template-columns: 1fr 1fr; }
      .metric { padding: 16px; }
      .metric--primary { grid-column: 1 / -1; }
      .toolbar {
        align-items: stretch;
        flex-direction: column;
        padding: 9px 14px;
      }
      .segmented { overflow-x: auto; }
      .segmented button { flex: 0 0 auto; }
      .toolbar__actions { justify-content: space-between; }
      .search-cluster { min-width: 0; flex: 1; }
      .shell { padding-right: 14px; padding-left: 14px; }
      .toc { top: 104px; margin: 0 -14px; padding-right: 14px; padding-left: 14px; }
      .integrity-panel { grid-template-columns: 1fr; }
